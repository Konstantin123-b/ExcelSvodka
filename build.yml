name: Build ExcelSvodka

on:
  push:
    branches:
      - develop
      - main

  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }

          pip install pyinstaller openpyxl PySide6

      - name: Check syntax
        run: |
          python -m compileall .

      - name: Build EXE
        run: |
          pyinstaller ^
            --noconfirm ^
            --clean ^
            --windowed ^
            --onefile ^
            --name ExcelSvodka ^
            run_gui.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ExcelSvodka
          path: dist/ExcelSvodka.exe
