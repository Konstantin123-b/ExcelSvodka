name: Build ExcelSvodka

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop

jobs:
  build:

    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check project structure
        shell: pwsh
        run: |
          Write-Host "===== PROJECT ====="
          Get-ChildItem -Recurse

          if (!(Test-Path "run_gui.py")) {
            throw "run_gui.py not found"
          }

          if (!(Test-Path "gui/main_window.py")) {
            throw "gui/main_window.py not found"
          }

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --windowed `
            --name ExcelSvodka `
            --collect-all PySide6 `
            --add-data "data;data" `
            run_gui.py

      - name: Show dist
        shell: pwsh
        run: |
          Write-Host "===== DIST ====="
          Get-ChildItem dist -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExcelSvodka-Windows
          path: dist/**
