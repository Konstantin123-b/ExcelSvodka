name: Build ExcelSvodka

on:
  workflow_dispatch:

  push:
    branches:
      - develop
      - main

jobs:
  build:

    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: cmd
        run: |
          pyinstaller ^
            --clean ^
            --noconfirm ^
            --windowed ^
            --name ExcelSvodka ^
            --add-data "data;data" ^
            run_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExcelSvodka-Windows
          path: dist/ExcelSvodka/**
